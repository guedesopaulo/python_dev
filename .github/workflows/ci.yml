name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to a full version tag: astral-sh no longer publishes the moving
        # @v8 major tag (supply-chain hardening).
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint, format, type-check (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Test with coverage
        run: |
          uv run coverage run --source=. --branch -m pytest
          uv run coverage report -m

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: python-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Unit tests run in the `check` job against the dev environment; the image ships
      # without dev dependencies. What is verified here is the artifact itself: that it
      # boots, serves the API, and still enforces auth.
      - name: Smoke test the running container
        run: |
          set -euo pipefail
          docker run -d --name app -p 8000:8000 \
            -e ENVIRONMENT=local -e LOCAL_API_TOKEN=ci-token python-dev:ci

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/echo?message=hi')" = "401"
          curl -fsS -H 'Authorization: Bearer ci-token' \
            'http://127.0.0.1:8000/echo?message=hi' | grep -q '"hi"'
          test "$(docker inspect -f '{{.State.Health.Status}}' app)" = "healthy"

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
