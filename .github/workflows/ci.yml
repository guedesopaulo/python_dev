name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # No job pushes with git credentials; don't leave them in .git/config.
          persist-credentials: false

      - name: Install uv
        # Pinned to a full version tag: astral-sh no longer publishes the moving
        # @v8 major tag (supply-chain hardening).
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      # Fails the build on known vulnerabilities in the lockfile (uv-native audit;
      # the preview flag only silences the experimental-feature warning).
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Lint, format, type-check (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # `make cov` is the same gate used locally: 100% on tests/*, plus the project floor.
      - name: Test with coverage
        run: make cov

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # No job pushes with git credentials; don't leave them in .git/config.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.3.0

      # Runs here rather than in pre-commit: the hadolint hook needs a Docker daemon.
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

      # Tag matches the `image:` key in docker-compose.yml, so the smoke tests below
      # can run with --no-build and still reuse this cached build.
      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: python-dev:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocking: application-layer CVEs are ours to fix by bumping the dependency.
      - name: Scan image dependencies (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: python-dev:local
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Informational: OS package CVEs come from the base image and are fixed by bumping
      # the `FROM` tag, not by the PR at hand. Blocking on them would turn unrelated PRs
      # red whenever Debian publishes an advisory. The weekly audit routine watches the
      # base image tag instead.
      - name: Scan image OS packages (Trivy, informational)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: python-dev:local
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      # Unit tests run in the `check` job against the dev environment; the image ships
      # without dev dependencies, so what is verified here is the artifact itself: that
      # it boots, serves, and still enforces auth. `--wait` blocks until the container's
      # HEALTHCHECK passes and fails the step if it never does, which is why there is no
      # hand-rolled readiness polling.
      - name: Smoke test the image (compose)
        env:
          LOCAL_API_TOKEN: ci-token
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 90 --no-build
          # Same assertions as `make smoke`, run against the container.
          bash scripts/03_smoke.sh http://127.0.0.1:8000

      # The standalone MCP profile is documented in the README, so keep it building and
      # passing its own healthcheck.
      - name: Smoke test the mcp-standalone profile
        env:
          LOCAL_API_TOKEN: ci-token
        run: |
          set -euo pipefail
          docker compose --profile mcp-standalone up -d --wait --wait-timeout 90 --no-build

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose --profile mcp-standalone ps -a || true
          docker compose --profile mcp-standalone logs --tail 100 || true
