repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix,  "--unsafe-fixes"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.1'
    hooks:
      - id: mypy

  # Pinned to the same uv version as the Dockerfile and CI.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.10
    hooks:
      - id: uv-lock

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos

  # hadolint runs in CI's docker job, not here: its pre-commit hook needs a running
  # Docker daemon, which would break `make check` on any machine without one up.

  # shellcheck-py, not koalaman/shellcheck-precommit: the latter runs through Docker.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: uv run deptry src tests
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$|^pyproject\.toml$
