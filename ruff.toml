force-exclude = true
extend-exclude = ["*.ipynb"]

[lint]
select = [
  "E", # pycodestyle
  "W", # pycodestyle
  "F", # pyflakes
  "C90", # mccabe
  "I", # isort
  "UP", # pyupgrade
  "N", # pep8-naming
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "PT", # flake8-pytest-style
  "ARG", # flake8-unused-arguments
  "PD", # pandas-vet
  "RUF" # ruff
]
ignore = ["UP040"]
fixable = ["I", "UP", "C4"]

[lint.isort]
force-single-line = true

[lint.mccabe]
# C901: max cyclomatic complexity per function. Matches ruff's current default,
# set explicitly so the limit is documented and immune to default changes.
max-complexity = 10

[lint.per-file-ignores]
"tests*" = ["ARG"]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
]
